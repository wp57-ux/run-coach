<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0e0d">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="A personal run/walk interval coach for the treadmill.">
  <title>Run Coach</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=Big+Shoulders+Display:wght@700;800;900&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"><main id="view"></main></div>

  <nav id="tabs" aria-label="Sections">
    <button data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>
      <span>Today</span>
    </button>
    <button data-tab="progress">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-7M10 20V8M15 20v-9M20 20V4" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg>
      <span>Progress</span>
    </button>
    <button data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18.5 7H20M4 17h1.5M10 17h10" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/><circle cx="16" cy="7" r="2.4" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="8" cy="17" r="2.4" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>
      <span>Settings</span>
    </button>
  </nav>

  <div id="screen"></div>
  <div id="sheet"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
